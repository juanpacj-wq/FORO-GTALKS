# ==============================================================================
#  Foro G-TALKS reverse proxy TLS
#
#  TODO va por proxy_pass a Express, aunque el sitio sea público.
#
#  Ya no es por el gate (el contenido se abrió; la única superficie con sesión es /api/me):
#  es porque Express es el ÚNICO origen de las cabeceras (CSP, COOP/CORP, X-Robots-Tag), del
#  404 JSON correcto para subrecursos rotos y del fallback SPA solo-para-navegaciones. Servir
#  dist/ desde disco con `alias`/`try_files` (el patrón del proyecto hermano) duplicaría esa
#  política aquí y las dos copias derivarían en silencio dos sitios que decir la verdad,
#  ninguno obligado a coincidir.
#
#  TLS: certificados de CA comercial instalados a mano en /etc/ssl/gtalks/ (no hay
#  certbot). `fullchain.pem` = certificate.crt + ca_bundle.crt, EN ESE ORDEN: la hoja
#  primero, la cadena después. Ver docs/RUNBOOK-DESPLIEGUE-CDP.md §Certificados.
#
#  Instalación:
#    sudo cp gtalks.conf /etc/nginx/sites-available/gtalks
#    sudo ln -s /etc/nginx/sites-available/gtalks /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Cortacircuitos de borde. Dimensionado para el pico real del evento: ~300 personas entrando a la
# misma hora DESDE UNA SOLA IP (NAT corporativo) generan ~37 r/s sostenidos; 100 r/s deja 2.7× de
# margen. Un límite más estricto bloquearía al auditorio entero y se leería como «el sitio se cayó».
limit_req_zone $binary_remote_addr zone=gtalks_req:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=gtalks_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name cdp.gecelca.com.co;
    # Sin certbot no hay desafío ACME que atender: el 80 solo redirige.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdp.gecelca.com.co;

    # --- TLS (CA comercial, instalada a mano; ver el runbook) ------------------
    ssl_certificate     /etc/ssl/gtalks/fullchain.pem;   # hoja + cadena, en ese orden
    ssl_certificate_key /etc/ssl/gtalks/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    # El stapling necesita la cadena de la CA para VERIFICAR la respuesta OCSP, y un
    # resolver para alcanzar al respondedor (127.0.0.53 es systemd-resolved, el local
    # de Ubuntu). Sin resolver, nginx arranca pero el stapling falla en silencio.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/gtalks/ca_bundle.crt;
    resolver 127.0.0.53 valid=300s;
    resolver_timeout 5s;

    server_tokens off;

    # --- Cabeceras de TRANSPORTE (las de contenido las pone Express) -----------
    # HSTS sin `preload`: el preload list es prácticamente irreversible y esto es un sitio que
    # funciona un día al año. includeSubDomains es seguro sobre un tercer nivel dedicado.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP, X-Frame-Options, Referrer-Policy, X-Content-Type-Options, COOP/CORP y X-Robots-Tag las
    # emite Express (helmet + política propia): dependen del contenido y allí no se duplican.

    # --- Límites ---------------------------------------------------------------
    client_max_body_size 16k;          # este sitio no recibe cuerpos: nada se sube nunca
    client_body_timeout 10s;
    send_timeout 30s;
    limit_conn gtalks_conn 50;

    # Mata en el borde el resto de métodos: cierra TRACE y deja el CSRF de la app como segunda
    # línea, no como única.
    limit_except GET HEAD POST { deny all; }

    # --- Healthcheck: interno, no público --------------------------------------
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }

    # --- Todo lo demás al gate -------------------------------------------------
    location / {
        limit_req zone=gtalks_req burst=300 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Estas cinco SOBRESCRIBEN lo que mande el cliente, que es justo el punto: el chequeo CSRF
        # y `trust proxy` de Express leen X-Forwarded-*, y una cabecera fabricada por el visitante
        # no puede ser la fuente de verdad sobre el protocolo o el host.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Sin query string en el log: los paths ya identifican al ponente consultado y no hace falta
    # guardar además los parámetros del callback OIDC.
    log_format gtalks '$remote_addr - $status "$request_method $uri" "$http_user_agent"';
    access_log /var/log/nginx/gtalks.access.log gtalks;
    error_log /var/log/nginx/gtalks.error.log;
}
